    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelPink: '#FCE4EC',
                        pastelPinkDeep: '#F48FB1',
                        pastelPinkDark: '#F06292',

                        pastelLavenderDeep: '#CE93D8',
                        pastelCream: '#FFF8E7',

            min-height: 100vh;
            color: #4A3E4E;

            user-select: none;
            -webkit-user-select: none;

        .soft-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(186, 104, 200, 0.15),
                        0 8px 16px rgba(244, 143, 177, 0.1);

        .btn-calc {

            overflow: hidden;

        .btn-calc:active {

                        inset 0 1px 4px rgba(0, 0, 0, 0.1);

            transition: transform 0.2s ease;
        }

        .calculator-container:hover .cat-ear-left {

        .calculator-container:hover .cat-ear-right {
            transform: rotate(8deg) translateY(-2px);

</head>

        <!-- HISTORY MODAL -->

                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 fill-pastelPinkDark" viewBox="0 0 24 24">
                            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.41l-1.41 1.41A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>

                <div class="pt-3 border-t border-pastelPink/50 flex justify-between items-center">

    <script>
        /* ----------------------------------------------------
           1. AUDIO SYNTHESIZER (Web Audio API)
           Generates realistic cute click & meow sounds offline!
           ---------------------------------------------------- */
        class CatAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playMeow() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                
                // Frequency contour simulating a cute "Mee-oow"
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(850, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.35);

                // Volume envelope
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.36);
            }
        }

        const audio = new CatAudio();

        /* ----------------------------------------------------
           2. CALCULATOR ENGINE
           ---------------------------------------------------- */
        class Calculator {
            constructor(expressionEl, resultEl) {
                this.expressionEl = expressionEl;
                this.resultEl = resultEl;
                this.currentInput = '0';
                this.previousInput = '';
                this.operator = null;
                this.shouldResetScreen = false;
                this.history = JSON.parse(localStorage.getItem('cat_calc_history') || '[]');
                this.updateDisplay();
            }

            appendNumber(number) {
                if (this.currentInput === '0' || this.shouldResetScreen) {
                    this.currentInput = number;
                    this.shouldResetScreen = false;
                } else {
                    if (this.currentInput.length < 14) {
                        this.currentInput += number;
                    }
                }
                this.updateDisplay();
            }

            appendDecimal() {
                if (this.shouldResetScreen) {
                    this.currentInput = '0.';
                    this.shouldResetScreen = false;
                } else if (!this.currentInput.includes('.')) {
                    this.currentInput += '.';
                }
                this.updateDisplay();
            }

            setOperator(op) {
                if (this.operator !== null && !this.shouldResetScreen) {
                    this.compute();
                }
                this.previousInput = this.currentInput;
                this.operator = op;
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousInput);
                const current = parseFloat(this.currentInput);

                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operator) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        if (current === 0) {
                            this.currentInput = 'Erro Miau!';
                            this.updateDisplay();
                            this.shouldResetScreen = true;
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // Format precision cleanly
                const formattedResult = Number(Math.round(parseFloat(computation + 'e8')) + 'e-8').toString();
                
                // Add to history
                const symbol = this.getOperatorSymbol(this.operator);
                const historyItem = {
                    expression: `${this.formatNumber(this.previousInput)} ${symbol} ${this.formatNumber(this.currentInput)}`,
                    result: formattedResult
                };
                this.addHistory(historyItem);

                audio.playMeow(); // Sound trigger on successful equation!

                this.currentInput = formattedResult;
                this.operator = null;
                this.previousInput = '';
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            percent() {
                const current = parseFloat(this.currentInput);
                if (isNaN(current)) return;
                this.currentInput = (current / 100).toString();
                this.updateDisplay();
            }

            negate() {
                if (this.currentInput === '0') return;
                this.currentInput = (parseFloat(this.currentInput) * -1).toString();
                this.updateDisplay();
            }

            clear() {
                this.currentInput = '0';
                this.previousInput = '';
                this.operator = null;
                this.shouldResetScreen = false;
                this.updateDisplay();
            }

            backspace() {
                if (this.shouldResetScreen) return;
                if (this.currentInput.length === 1 || (this.currentInput.length === 2 && this.currentInput.startsWith('-'))) {
                    this.currentInput = '0';
                } else {
                    this.currentInput = this.currentInput.slice(0, -1);
                }
                this.updateDisplay();
            }

            getOperatorSymbol(op) {
                switch(op) {
                    case '+': return '+';
                    case '-': return '−';
                    case '*': return '×';
                    case '/': return '÷';
                    default: return '';
                }
            }

            formatNumber(numStr) {
                if (!numStr || numStr === 'Erro Miau!') return numStr;
                const parts = numStr.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                return parts.join(',');
            }

            updateDisplay() {
                this.resultEl.textContent = this.formatNumber(this.currentInput);
                if (this.operator != null) {
                    this.expressionEl.textContent = `${this.formatNumber(this.previousInput)} ${this.getOperatorSymbol(this.operator)}`;
                } else {
                    this.expressionEl.textContent = '';
                }
            }

            addHistory(item) {
                this.history.unshift(item);
                if (this.history.length > 20) this.history.pop();
                localStorage.setItem('cat_calc_history', JSON.stringify(this.history));
                renderHistory();
            }

            clearHistory() {
                this.history = [];
                localStorage.removeItem('cat_calc_history');
                renderHistory();
            }
        }

        // Initialize elements and Calculator
        const expressionDisplay = document.getElementById('expressionDisplay');
        const resultDisplay = document.getElementById('resultDisplay');
        const calc = new Calculator(expressionDisplay, resultDisplay);

        /* ----------------------------------------------------
           3. UI EVENT LISTENERS & KEYBOARD HANDLERS
           ---------------------------------------------------- */
        document.querySelectorAll('.btn-calc').forEach(button => {
            button.addEventListener('click', () => {
                audio.playClick();

                const num = button.dataset.num;
                const action = button.dataset.action;
                const val = button.dataset.val;

                if (num !== undefined) {
                    calc.appendNumber(num);
                } else if (action) {
                    switch(action) {
                        case 'clear': calc.clear(); break;
                        case 'backspace': calc.backspace(); break;
                        case 'decimal': calc.appendDecimal(); break;
                        case 'operator': calc.setOperator(val); break;
                        case 'equals': calc.compute(); break;
                        case 'percent': calc.percent(); break;
                        case 'negate': calc.negate(); break;
                    }
                }
            });
        });

        // Physical Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                audio.playClick();
                calc.appendNumber(e.key);
            } else if (e.key === '.' || e.key === ',') {
                audio.playClick();
                calc.appendDecimal();
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                audio.playClick();
                calc.setOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calc.compute();
            } else if (e.key === 'Backspace') {
                audio.playClick();
                calc.backspace();
            } else if (e.key === 'Escape') {
                audio.playClick();
                calc.clear();
            } else if (e.key === '%') {
                audio.playClick();
                calc.percent();
            }
        });

        // Audio Toggle
        const btnAudioToggle = document.getElementById('btnAudioToggle');
        const iconSoundOn = document.getElementById('iconSoundOn');
        const iconSoundOff = document.getElementById('iconSoundOff');

        btnAudioToggle.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            if (audio.enabled) {
                iconSoundOn.classList.remove('hidden');
                iconSoundOff.classList.add('hidden');
                audio.playMeow();
            } else {
                iconSoundOn.classList.add('hidden');
                iconSoundOff.classList.remove('hidden');
            }
        });

        // History Modal Functionality
        const historyModal = document.getElementById('historyModal');
        const btnHistoryToggle = document.getElementById('btnHistoryToggle');
        const btnCloseHistory = document.getElementById('btnCloseHistory');
        const btnClearHistory = document.getElementById('btnClearHistory');
        const historyList = document.getElementById('historyList');

        function renderHistory() {
            historyList.innerHTML = '';
            if (calc.history.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-8 text-pastelText/50 text-sm">
                        Nenhum cálculo salvo ainda, miau!
                    </div>
                `;
                return;
            }

            calc.history.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'p-2.5 bg-pastelPink/20 hover:bg-pastelPink/40 rounded-xl cursor-pointer transition-colors flex justify-between items-center';
                el.innerHTML = `
                    <span class="text-xs text-pastelText/70 font-medium">${item.expression} =</span>
                    <span class="text-sm font-bold text-pastelText">${calc.formatNumber(item.result)}</span>
                `;
                el.addEventListener('click', () => {
                    audio.playClick();
                    calc.currentInput = item.result;
                    calc.shouldResetScreen = true;
                    calc.updateDisplay();
                    historyModal.classList.add('hidden');
                });
                historyList.appendChild(el);
            });
        }

        btnHistoryToggle.addEventListener('click', () => {
            audio.playClick();
            renderHistory();
            historyModal.classList.remove('hidden');
        });

        btnCloseHistory.addEventListener('click', () => {
            audio.playClick();
            historyModal.classList.add('hidden');
        });

        btnClearHistory.addEventListener('click', () => {
            audio.playClick();
            calc.clearHistory();
        });

        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) historyModal.classList.add('hidden');
        });

        /* ----------------------------------------------------
           4. DYNAMIC PWA MANIFEST & SERVICE WORKER BLOB
           Enables local-first PWA installation without server files!
           ---------------------------------------------------- */
        
        // SVG Icon Data URL for PWA
        const pwaIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%23F48FB1"><rect width="512" height="512" rx="120" fill="%23FCE4EC"/><path d="M160 120 C120 120, 80 200, 80 260 L80 340 C80 400, 160 440, 256 440 C352 440, 432 400, 432 340 L432 260 C432 200, 392 120, 352 120 L300 180 C270 160, 242 160, 212 180 Z" fill="%23F48FB1"/><circle cx="180" cy="270" r="24" fill="%234A3E4E"/><circle cx="332" cy="270" r="24" fill="%234A3E4E"/><polygon points="256,310 236,290 276,290" fill="%23FF80AB"/></svg>`;
        const pwaIconUrl = `data:image/svg+xml;utf8,${encodeURIComponent(pwaIconSvg)}`;

        // Inject Dynamic Manifest
        const manifestObj = {
            name: "Calculadora de Gatinhos",
            short_name: "GatiCalc",
            description: "Uma fofa calculadora de gatinhos pastel e local-first",
            start_url: "./",
            display: "standalone",
            background_color: "#FCE4EC",
            theme_color: "#F48FB1",
            icons: [
                {
                    src: pwaIconUrl,
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestURL;
        document.head.appendChild(manifestLink);

        // Service Worker Script Blob for Offline Support
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'cat-calc-v1';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((res) => res || fetch(e.request).catch(() => res))
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            navigator.serviceWorker.register(swUrl).catch(() => {
                // Silent fail if Blob SW registration is blocked by environment
            });
        }

        // Handle PWA Install Prompt Banner
        let deferredPrompt;
        const pwaInstallBanner = document.getElementById('pwaInstallBanner');
        const btnInstallPwa = document.getElementById('btnInstallPwa');
        const btnClosePwa = document.getElementById('btnClosePwa');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaInstallBanner.classList.remove('hidden');
        });

        btnInstallPwa.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                pwaInstallBanner.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        btnClosePwa.addEventListener('click', () => {
            pwaInstallBanner.classList.add('hidden');
        });
    </script>
</body>
</html>
